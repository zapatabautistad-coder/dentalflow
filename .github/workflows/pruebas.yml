name: Pruebas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # en un PR, HEAD^1 es la punta de la rama base

      # Misma regla que el hook de Claude: toda migración trae prueba SQL y línea en MAPA.md.
      # Copilot hace commits en GitHub y no pasa por los hooks; aquí se le frena.
      - name: Migraciones con prueba y MAPA
        if: github.event_name == 'pull_request'
        run: node scripts/check-migraciones.mjs --base HEAD^1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # lint + typecheck + unitarias, con salida corta (scripts/verify.mjs).
      - run: npm run verify:fast

      # Supabase local en Docker (nunca producción); escribe .env.e2e.
      - run: npm run test:e2e:setup

      # Los tipos de la base deben coincidir con las migraciones (npm run db:types).
      - name: Tipos de la base al día
        run: |
          npm run db:types
          git diff --exit-code src/lib/supabase/database.types.ts || {
            echo "::error::Los tipos no coinciden con las migraciones. Corre npm run test:e2e:setup y npm run db:types, y sube src/lib/supabase/database.types.ts."
            exit 1
          }

      # La foto del esquema debe coincidir con las migraciones (npm run db:schema).
      - name: Esquema al día
        run: |
          npm run db:schema
          git diff --exit-code supabase/schema.sql || {
            echo "::error::supabase/schema.sql no coincide con las migraciones. Corre npm run test:e2e:setup y npm run db:schema, y súbelo."
            exit 1
          }

      # Reglas RLS, permisos y auditoría directamente en PostgreSQL local.
      - run: npm run test:db

      - name: Build con las variables de la base local
        run: |
          set -a; . ./.env.e2e; set +a
          npm run build

      - name: Arrancar la app
        run: |
          set -a; . ./.env.e2e; set +a
          nohup npx next start -p 3100 > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3100/login; then
              echo "App lista tras ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "La app no respondió en 60 s. Log del servidor:"
          cat server.log
          exit 1

      - run: npx playwright install --with-deps chromium

      - name: Pruebas E2E
        run: |
          set -a; . ./.env.e2e; set +a
          npm run test:e2e

      - name: Log del servidor (si falló)
        if: failure()
        run: cat server.log || true

      - name: Subir resultados de las pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
