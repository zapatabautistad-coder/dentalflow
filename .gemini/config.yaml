# Gemini Code Assist en GitHub (revisión de PR). Las reglas están en styleguide.md.
have_fun: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
ignore_patterns:
  - "package-lock.json"
  - "public/**"
  - "dentalflow-v2.zip"
